<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Knowledge &amp; Learning Tracker</title>
<meta name="description" content="Track your ERP module knowledge, learning progress and practical experience.">

<link rel="dns-prefetch" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://cdn.jsdelivr.net/npm/quill@2.0.0/dist/quill.snow.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.0/dist/quill.min.js"></script>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">

<body data-theme="light">

<div id="toast-stack" class="toast-stack" aria-live="polite"></div>
<div id="modal-root"></div>

<!-- ===================== AUTH SCREEN ===================== -->
<div id="auth-screen" class="auth-wrap hidden">
  <div class="lang-switch lang-switch-floating">
    <button class="lang-btn" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="ar">AR</button>
  </div>

  <div class="auth-card card">
    <div class="auth-brand">
      <svg class="dial" width="30" height="30" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="var(--brass)" stroke-width="2"/><path d="M16 16 L23 10" stroke="var(--brass)" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="16" r="2.2" fill="var(--brass)"/></svg>
      <div class="auth-brand-text" data-i18n="app.name">ERP Knowledge &amp; Learning Tracker</div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-auth-tab="login" id="tab-login" data-i18n="auth.login">Log In</button>
      <button class="auth-tab" data-auth-tab="signup" id="tab-signup" data-i18n="auth.signup">Sign Up</button>
    </div>

    <!-- Login form -->
    <form id="login-form">
      <div class="field">
        <label for="login-identifier" data-i18n="auth.usernameOrEmail">Username or Email</label>
        <input id="login-identifier" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password" data-i18n="auth.password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
      </div>
      <div class="field checkbox-row">
        <input type="checkbox" id="login-remember">
        <label for="login-remember" style="margin:0;" data-i18n="auth.rememberMe">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" data-i18n="auth.loginButton">Log In</button>
      <p id="login-error" class="field-hint" style="color:var(--rust);"></p>
    </form>

    <!-- Signup form -->
    <form id="signup-form" class="hidden">
      <div class="field">
        <label for="signup-fullname" data-i18n="auth.fullName">Full Name</label>
        <input id="signup-fullname" type="text" required>
      </div>
      <div class="field">
        <label for="signup-username" data-i18n="auth.username">Username</label>
        <input id="signup-username" type="text" required>
      </div>
      <div class="field">
        <label for="signup-email" data-i18n="auth.email">Email</label>
        <input id="signup-email" type="email" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="signup-password" data-i18n="auth.password">Password</label>
          <input id="signup-password" type="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="signup-confirm" data-i18n="auth.confirmPassword">Confirm Password</label>
          <input id="signup-confirm" type="password" autocomplete="new-password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" data-i18n="auth.createAccount">Create Account</button>
      <p id="signup-error" class="field-hint" style="color:var(--rust);"></p>
    </form>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <svg class="dial" width="30" height="30" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="var(--brass)" stroke-width="2"/><path d="M16 16 L23 10" stroke="var(--brass)" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="16" r="2.2" fill="var(--brass)"/></svg>
      <div class="sidebar-brand-text"><span data-i18n="app.name">ERP Knowledge Tracker</span><small data-i18n="app.tagline">LEARNING LEDGER</small></div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <button class="nav-item" data-route="dashboard"><span class="dot"></span><span data-i18n="nav.dashboard">Dashboard</span></button>

      <div class="nav-section-label" data-i18n="nav.modules">Modules</div>
      <div id="nav-modules"><!-- populated by app.js --></div>

      <div class="nav-section-label" data-i18n="nav.learning">Learning</div>
      <button class="nav-item" data-route="notes"><span class="dot"></span><span data-i18n="nav.allNotes">All Notes</span></button>
      <button class="nav-item" data-route="favorites"><span class="dot"></span><span data-i18n="nav.favorites">Favorites</span></button>
      <button class="nav-item" data-route="ai-insights"><span class="dot"></span><span data-i18n="nav.aiInsights">AI Daily Insights</span></button>
      <button class="nav-item" data-route="gaps"><span class="dot"></span><span data-i18n="nav.knowledgeGaps">Knowledge Gaps</span></button>
      <button class="nav-item" data-route="review"><span class="dot"></span><span data-i18n="nav.reviewCenter">Review Center</span></button>
      <button class="nav-item" data-route="analytics"><span class="dot"></span><span data-i18n="nav.analytics">Analytics</span></button>
      <button class="nav-item" data-route="system-test"><span class="dot"></span><span data-i18n="nav.systemTest">🧪 System Test</span></button>

      <div class="nav-section-label" data-i18n="nav.toolsSection">Enterprise Tools</div>
      <button class="nav-item" data-route="daily-quiz"><span class="dot"></span><span data-i18n="nav.dailyQuiz">🎯 Daily Quiz</span></button>
      <button class="nav-item" data-route="multi-erp"><span class="dot"></span><span data-i18n="nav.multiErp">🔄 Multi-ERP Matrix</span></button>
      <button class="nav-item" data-route="journal-sim"><span class="dot"></span><span data-i18n="nav.journalSim">📑 Journal Simulator</span></button>
      <button class="nav-item" data-route="implementer-toolkit"><span class="dot"></span><span data-i18n="nav.implementerToolkit">🛠️ Implementer Toolkit</span></button>
      <button class="nav-item" data-route="process-flow"><span class="dot"></span><span data-i18n="nav.processFlow">🔄 Process Flows</span></button>
      <button class="nav-item" data-route="gantt-builder"><span class="dot"></span><span data-i18n="nav.ganttBuilder">📅 Gantt Builder</span></button>

      <div class="nav-section-label" data-i18n="nav.account">Account</div>
      <button class="nav-item" data-route="profile"><span class="dot"></span><span data-i18n="nav.myProfile">My Profile</span></button>
      <button class="nav-item hidden" id="nav-admin" data-route="admin"><span class="dot"></span><span data-i18n="nav.administration">Administration</span></button>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-ghost" id="logout-btn" style="width:100%; color:var(--paper);" data-i18n="nav.logout">Logout</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">&#9776;</button>
        <h1 class="topbar-title" id="page-title">Dashboard</h1>
      </div>
        <div class="topbar-actions">
          <div class="search-box" id="global-search-container">
            <span class="icon">&#128269;</span>
            <input id="global-search" type="text" data-i18n-placeholder="nav.searchPlaceholder" placeholder="Search topics across all modules..." autocomplete="off">
            <button type="button" class="search-clear-btn" id="global-search-clear" title="Clear search">✕</button>
            <div class="search-results-dropdown" id="global-search-dropdown"></div>
          </div>
          <div class="lang-switch">
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="ar">AR</button>
          </div>
          <div id="autosync-badge" title="Auto-syncing silently in background with database"
               style="display:flex; align-items:center; gap:5px; padding:4px 10px; background:var(--paper-raised); border:1px solid var(--line); border-radius:20px; font-size:11.5px; font-family:var(--font-mono); color:var(--ink-soft); cursor:pointer;">
            <span id="autosync-dot" style="width:7px; height:7px; border-radius:50%; background:var(--teal); display:inline-block; transition:all 0.3s ease;"></span>
            <span id="autosync-text">Live</span>
          </div>
          <div id="offline-badge" title="Offline — changes will sync when reconnected"
               style="display:none; align-items:center; gap:4px; padding:4px 10px; background:var(--rust); color:#fff; border-radius:20px; font-size:12px; font-weight:600;">
            <span style="width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block;"></span>
            Offline
          </div>
          <button class="btn btn-icon" id="theme-toggle" aria-label="Toggle dark mode">&#9789;</button>
          <button class="btn btn-icon" id="global-sync-btn" title="Sync All from Database" aria-label="Sync All Database">🔄</button>
          <button class="btn btn-primary btn-sm" id="quick-add-btn" data-i18n="nav.quickAdd">+ Quick Add</button>
        </div>
    </div>
    <div class="content" id="content">
      <div class="loading-row"><span class="spinner"></span> <span data-i18n="common.loading">Loading...</span></div>
    </div>
  </div>
</div>

<script>
  // Service Worker registration — enables offline mode + asset caching
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        // Check for updates and notify the SW to skip waiting
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              newWorker.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        });
      }).catch(() => { /* SW not critical — app works fine without it */ });

      // Relay SW messages (e.g. ONLINE after sync)
      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data && event.data.type === 'ONLINE') {
          document.getElementById('offline-badge') && (document.getElementById('offline-badge').style.display = 'none');
        }
      });
    });
  }

  // Offline / Online indicators
  function updateOnlineStatus() {
    const badge = document.getElementById('offline-badge');
    if (!badge) return;
    badge.style.display = navigator.onLine ? 'none' : 'flex';
  }
  window.addEventListener('online',  updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  window.addEventListener('load',    updateOnlineStatus);
</script>
</body>
