<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Knowledge &amp; Learning Tracker</title>
<meta name="description" content="Track your ERP module knowledge, learning progress and practical experience.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">

<div id="toast-stack" class="toast-stack" aria-live="polite"></div>
<div id="modal-root"></div>

<!-- ===================== AUTH SCREEN ===================== -->
<div id="auth-screen" class="auth-wrap hidden">
  <div class="auth-card card">
    <div class="auth-brand">
      <svg class="dial" width="30" height="30" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="var(--brass)" stroke-width="2"/><path d="M16 16 L23 10" stroke="var(--brass)" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="16" r="2.2" fill="var(--brass)"/></svg>
      <div class="auth-brand-text">ERP Knowledge &amp; Learning Tracker</div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-auth-tab="login" id="tab-login">Log In</button>
      <button class="auth-tab" data-auth-tab="signup" id="tab-signup">Sign Up</button>
    </div>

    <!-- Login form -->
    <form id="login-form">
      <div class="field">
        <label for="login-identifier">Username or Email</label>
        <input id="login-identifier" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
      </div>
      <div class="field checkbox-row">
        <input type="checkbox" id="login-remember">
        <label for="login-remember" style="margin:0;">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Log In</button>
      <p id="login-error" class="field-hint" style="color:var(--rust);"></p>
    </form>

    <!-- Signup form -->
    <form id="signup-form" class="hidden">
      <div class="field">
        <label for="signup-fullname">Full Name</label>
        <input id="signup-fullname" type="text" required>
      </div>
      <div class="field">
        <label for="signup-username">Username</label>
        <input id="signup-username" type="text" required>
      </div>
      <div class="field">
        <label for="signup-email">Email</label>
        <input id="signup-email" type="email" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="signup-password">Password</label>
          <input id="signup-password" type="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="signup-confirm">Confirm Password</label>
          <input id="signup-confirm" type="password" autocomplete="new-password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
      <p id="signup-error" class="field-hint" style="color:var(--rust);"></p>
    </form>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <svg class="dial" width="30" height="30" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="var(--brass)" stroke-width="2"/><path d="M16 16 L23 10" stroke="var(--brass)" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="16" r="2.2" fill="var(--brass)"/></svg>
      <div class="sidebar-brand-text">ERP Knowledge Tracker<small>LEARNING LEDGER</small></div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <button class="nav-item" data-route="dashboard"><span class="dot"></span>Dashboard</button>

      <div class="nav-section-label">Modules</div>
      <div id="nav-modules"><!-- populated by app.js --></div>

      <div class="nav-section-label">Learning</div>
      <button class="nav-item" data-route="gaps"><span class="dot"></span>Knowledge Gaps</button>
      <button class="nav-item" data-route="review"><span class="dot"></span>Review Center</button>
      <button class="nav-item" data-route="analytics"><span class="dot"></span>Analytics</button>

      <div class="nav-section-label">Account</div>
      <button class="nav-item" data-route="profile"><span class="dot"></span>My Profile</button>
      <button class="nav-item hidden" id="nav-admin" data-route="admin"><span class="dot"></span>Administration</button>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-ghost" id="logout-btn" style="width:100%; color:var(--paper);">Logout</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">&#9776;</button>
        <h1 class="topbar-title" id="page-title">Dashboard</h1>
      </div>
      <div class="topbar-actions">
        <div class="search-box">
          <span class="icon">&#128269;</span>
          <input id="global-search" type="text" placeholder="Search topics across all modules...">
        </div>
        <button class="btn btn-icon" id="theme-toggle" aria-label="Toggle dark mode">&#9789;</button>
        <select id="lang-switcher" class="btn btn-ghost" aria-label="Switch language" style="padding:8px 12px; font-size:13px;">
          <option value="en">EN</option>
          <option value="ar">عربي</option>
        </select>
        <button class="btn btn-primary btn-sm" id="quick-add-btn">+ Quick Add</button>
      </div>
    </div>
    <div class="content" id="content">
      <div class="loading-row"><span class="spinner"></span> Loading...</div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/modules.js"></script>
<script src="js/topics.js"></script>
<script src="js/knowledge.js"></script>
<script src="js/reviews.js"></script>
<script src="js/analytics.js"></script>
<script src="js/profile.js"></script>
<script src="js/categories.js"></script>
<script src="js/app.js"></script>
</body>
</html>
